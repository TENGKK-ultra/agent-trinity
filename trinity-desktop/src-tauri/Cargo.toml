[package]
name = "trinity-desktop"
version = "0.2.0"
description = "Trinity — service and bridge platform for Claude, Codex and DSH"
authors = ["Trinity Developer"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "trinity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
